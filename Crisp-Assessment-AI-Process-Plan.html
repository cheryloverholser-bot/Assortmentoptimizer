<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>crisp. — Assessment Process (AI-Enhanced)</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
       background: var(--bg); color: #1a1a1a; font-size: 14px; line-height: 1.5; }
:root {
  --green:       #00C49A;
  --green-dark:  #009E7C;
  --green-light: #e6f9f4;
  --green-border:#a8e6d9;
  --teal-dark:   #0D3D35;
  --bg:          #eef3f2;
  --card:        #ffffff;
  --border:      #d4e4e1;
  --muted:       #5a7a74;
}
.topbar {
  background: var(--teal-dark); color: white;
  padding: 0 24px; height: 52px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar::before {
  content: ''; position: absolute; right: 180px; top: 0; bottom: 0; width: 200px;
  background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
  background-size: 10px 10px; pointer-events: none;
}
.topbar-left { display: flex; align-items: center; gap: 14px; }
.logo-pill { background: var(--green); color: white; font-weight: 700;
             font-size: 15px; padding: 3px 11px; border-radius: 3px; }
.topbar-title { font-size: 12px; opacity: 0.65; text-transform: uppercase; letter-spacing: 0.8px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-client { font-size: 12px; opacity: 0.5; }
.topbar-client span { opacity: 1; font-weight: 600; color: var(--green); }
.btn-new-project { background: var(--green); color: white; border: none;
                   font-size: 11px; font-weight: 600; padding: 5px 11px;
                   border-radius: 5px; cursor: pointer; }
.btn-new-project:hover { background: var(--green-dark); }
.shell { display: flex; height: calc(100vh - 52px); }
.sidebar { width: 220px; background: white; border-right: 1px solid var(--border);
           overflow-y: auto; flex-shrink: 0; }
.sidebar-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
                          color: #9ab8b4; padding: 20px 18px 8px; }
.nav-list { list-style: none; }
.nav-item { padding: 9px 16px; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 9px;
            border-left: 3px solid transparent; color: var(--muted); transition: all 0.12s; }
.nav-item.active { background: var(--green-light); border-left-color: var(--green);
                   color: var(--teal-dark); font-weight: 600; }
.nav-item:hover:not(.active) { background: #f5faf9; }
.nav-badge { width: 20px; height: 20px; border-radius: 50%; background: #daeee9;
             display: flex; align-items: center; justify-content: center;
             font-size: 10px; font-weight: 700; flex-shrink: 0; color: var(--muted); }
.nav-item.active .nav-badge { background: var(--green); color: white; }
.nav-progress { margin-left: auto; font-size: 10px; color: var(--green); font-weight: 700; }
.sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
.nav-link { padding: 7px 16px; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; color: #9ab8b4;
            transition: all 0.12s; border-left: 3px solid transparent; }
.nav-link:hover { background: #f5faf9; color: var(--muted); }
.nav-link.active { background: var(--green-light); border-left-color: var(--green);
                   color: var(--teal-dark); font-weight: 600; }
.main { flex: 1; overflow-y: auto; padding: 30px 34px; }
.hidden { display: none !important; }
.page-section { display: none; }
.page-section.active { display: block; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo-pill">crisp.</div>
    <div class="topbar-title">Assessment Process — AI-Enhanced v2.0</div>
  </div>
  <div class="topbar-right">
    <div class="topbar-client">Project: <span id="clientDisplay">—</span></div>
    <button class="btn-new-project" onclick="newProject()">+ New Project</button>
  </div>
</div>
<div class="shell">
  <div class="sidebar">
    <div class="sidebar-section-label">Phases</div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="nav('overview')"><span>🏠</span> Overview</li>
      <li class="nav-item" onclick="nav('phase1')" id="nav-phase1">
        <div class="nav-badge">1</div> Intake
        <span class="nav-progress hidden" id="prog1"></span>
      </li>
      <li class="nav-item" onclick="nav('phase2')" id="nav-phase2">
        <div class="nav-badge">2</div> Discovery
        <span class="nav-progress hidden" id="prog2"></span>
      </li>
      <li class="nav-item" onclick="nav('phase3')" id="nav-phase3">
        <div class="nav-badge">3</div> Analysis
        <span class="nav-progress hidden" id="prog3"></span>
      </li>
      <li class="nav-item" onclick="nav('phase4')" id="nav-phase4">
        <div class="nav-badge">4</div> Roadmap &amp; Readout
        <span class="nav-progress hidden" id="prog4"></span>
      </li>
    </ul>
    <hr class="sidebar-divider">
    <div class="nav-link" id="nav-prompts" onclick="nav('prompts')">🤖 AI Prompt Library</div>
    <div class="nav-link" id="nav-raci" onclick="nav('raci')">📋 RACI Quick Reference</div>
    <div class="nav-link" id="nav-gates" onclick="nav('gates')">🚦 Decision Gates</div>
  </div>
  <div class="main" id="mainContent">
    <p>Main content here</p>
  </div>
</div>
<script>
function nav(page) {
  document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item, .nav-link').forEach(i => i.classList.remove('active'));
  const section = document.getElementById('page-' + page);
  if (section) section.classList.add('active');
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  document.getElementById('mainContent').scrollTop = 0;
}
function newProject() { /* placeholder — implemented in Task 3 */ }
</script>
</body>
</html>
